spring.datasource.url=jdbc:h2:mem:jovens_yoga_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.security.jwt.secret=test-only-jwt-secret-key-not-for-production-use-32chars
app.security.jwt.expiration-minutes=60
app.security.cors.allowed-origins=http://localhost:5173
