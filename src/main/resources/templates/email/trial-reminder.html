<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#fff9f0;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff9f0;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #eeeeee;">
          <tr>
            <td style="background:#ff6b1b;padding:28px 32px;">
              <h1 style="margin:0;color:#ffffff;font-size:22px;">Jovens Yoga</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="font-size:16px;color:#111111;margin:0 0 16px;">Hi {{customerName}},</p>
              <p style="font-size:16px;color:#333333;line-height:1.6;margin:0 0 16px;">
                Your <strong>{{planName}}</strong> trial has <strong>{{remainingDays}} day(s)</strong> left, ending on
                <strong>{{trialExpiryDate}}</strong>.
              </p>
              <p style="font-size:16px;color:#333333;line-height:1.6;margin:0 0 24px;">
                Loving your practice so far? Keep it going without interruption by upgrading to Standard or Premium.
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:30px;background:#ff6b1b;">
                    <a href="{{buyPlanUrl}}" style="display:inline-block;padding:14px 28px;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;">
                      Buy a Plan
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#fafafa;border-top:1px solid #eeeeee;">
              <p style="font-size:12px;color:#999999;margin:0;">Jovens Yoga · Trial reminder notification.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
