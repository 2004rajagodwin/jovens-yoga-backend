# Jovens Yoga backend configuration.
# Single Spring Boot configuration file (application.yml has been removed).
#
# Local secrets live in a gitignored jovens-yoga-backend/.env file (KEY=VALUE, same
# syntax as this file), loaded natively via spring.config.import below — no third-party
# dotenv dependency needed. .env is never committed (see .gitignore) and every value
# referenced here is a ${VAR:default} placeholder — no secret is ever written directly
# into this file.
spring.config.import=optional:file:.env[.properties]

spring.application.name=jovens-yoga

# --- Database (local MariaDB/MySQL via XAMPP) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jovens_yoga}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Mail transport (Gmail SMTP) ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# --- JWT (admin auth) ---
app.security.jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-min-32-chars}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- CORS ---
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Stripe (TEST MODE keys only for local dev) ---
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancelled}

# --- Email "From" identity (not a secret) ---
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@jovensyoga.com}
app.mail.from-name=${MAIL_FROM_NAME:Jovens Yoga}

# --- Frontend base URL (used to build links in emails) ---
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- AskEva WhatsApp (still a PENDING stub pending real integration) ---
app.askeva.api-url=${ASKEVA_API_URL:}
app.askeva.api-key=${ASKEVA_API_KEY:}
app.askeva.template-id=${ASKEVA_TEMPLATE_ID:}
app.askeva.otp-template-id=${ASKEVA_OTP_TEMPLATE_ID:}

# --- OTP verification (WhatsApp via AskEva) ---
# TEST mode: no real WhatsApp send, OTP is logged + returned in the API response for dev testing.
# LIVE mode: real AskEva WhatsApp send, OTP is never logged or exposed in any API response.
app.otp.mode=${OTP_MODE:TEST}
app.otp.length=${OTP_LENGTH:4}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}
app.otp.verification-token-ttl-minutes=${OTP_VERIFICATION_TOKEN_TTL_MINUTES:15}

# --- Free trial configuration ---
app.trial.default-duration-days=${TRIAL_DEFAULT_DURATION_DAYS:5}
app.trial.reminder-days=${TRIAL_REMINDER_DAYS:1,2,3,4,5}
app.trial.reminder-cron=${TRIAL_REMINDER_CRON:0 0 * * * *}
app.trial.expiry-cron=${TRIAL_EXPIRY_CRON:0 15 * * * *}

# --- Initial admin account (seeded on startup only if this username doesn't exist yet) ---
app.admin.seed-username=${ADMIN_SEED_USERNAME:Jovensyoga2026}
app.admin.seed-name=${ADMIN_SEED_NAME:Jovens Yoga Admin}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:}

# --- Logging ---
logging.level.com.jovens.yoga=INFO
